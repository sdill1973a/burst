# Publish burst-codec to PyPI on a version tag — via PyPI Trusted Publishing (OIDC), the same way linafish does:
# no token is stored anywhere; PyPI verifies the upload came from this repo and this workflow.
#
# ONE-TIME SETUP on the owner's PyPI account (pending publisher, before the first release):
#   https://pypi.org/manage/account/publishing/
#     PyPI project name: burst-codec   Owner: sdill1973a   Repository: burst
#     Workflow name:     release.yml   Environment: pypi
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re;print(re.search(r'__version__\s*=\s*[\"\047]([^\"\047]+)',open('codec/__init__.py').read()).group(1))")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package $PKG"; exit 1; }

      - name: Verify the version is blessed
        run: |
          grep -qx "${GITHUB_REF_NAME}" RELEASE_BLESSING \
            || { echo "::error::${GITHUB_REF_NAME} absent from RELEASE_BLESSING"; exit 1; }

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist codec

      - name: Install the wheel clean and run the self-test
        run: |
          pip install numpy
          pip install --no-deps dist/*.whl
          cd /tmp && burst-codec selftest

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
